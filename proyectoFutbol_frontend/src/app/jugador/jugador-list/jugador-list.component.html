<div>
  <h2>Jugadores</h2>
  <button class="nuevo" (click)="nuevo()">+ Nuevo jugador</button>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Posición</th>
        <th>Dorsal</th>
        <th>Equipo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let jugador of jugadores">
        <td>{{ jugador.nombre }}</td>
        <td>{{ jugador.posicion }}</td>
        <td>{{ jugador.dorsal }}</td>
        <td>{{ jugador.equipo?.nombre }}</td>
        <td>
          <button class="btn-editar" (click)="editar(jugador.id)">Editar</button>
          <button class="btn-eliminar" (click)="eliminar(jugador.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
