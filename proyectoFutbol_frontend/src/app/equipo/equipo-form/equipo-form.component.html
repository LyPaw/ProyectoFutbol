<div class="form-container">
  <h2>{{ esEdicion ? 'Editar equipo' : 'Nuevo equipo' }}</h2>

  <div class="form-group">
    <label>Nombre</label>
    <input [(ngModel)]="equipo.nombre" placeholder="Nombre del equipo" />
  </div>

  <div class="form-group">
    <label>Ciudad</label>
    <input [(ngModel)]="equipo.ciudad" placeholder="Ciudad" />
  </div>

  <div class="form-group">
    <label>Estadio</label>
    <input [(ngModel)]="equipo.estadio" placeholder="Estadio" />
  </div>

  <div class="form-group">
    <label>Fundación</label>
    <input [(ngModel)]="equipo.fundacion" type="number" placeholder="Año de fundación" />
  </div>

  <div class="form-actions">
    <button class="btn-guardar" (click)="guardar()">Guardar</button>
    <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
  </div>
</div>
